[workspace.package]
homepage = "https://thumbrella.dev"
repository = "https://github.com/thumbrella-dev/thumbrella"
description = "Fast thumbnail server for online media"
keywords = ["thumbnail", "media"]
categories = ["web-programming::http-server", "multimedia", "graphics", "rendering"]
license = "Apache-2.0"
version = "2.0.0"
edition = "2024"

[package]
name = "thumbrella"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-windows-x86_64.zip"
pkg-fmt = "zip"

# Distinct lib name avoids a doc-output collision with tier3's `thumbrella` bin.
[lib]
name = "thumbrella_doc"

[[bin]]
name = "thumbrella"
path = "tier3/src/bin/tier3.rs"

[dependencies]
tier1 = { path = "tier1" }
tier3 = { path = "tier3" }
tokio = { version = "1", features = ["full"] }

[workspace]
resolver = "2"
default-members = ["tier3"]
members = ["ffs/ffs-check", "ffs/ffs-build", "tier1", "tier2", "tier3"]


[profile.dev]
opt-level = 0      # no optimizations, required for reliable variable inspection
debug = 2          # full debug info (variables, types, not just line tables)
incremental = true
codegen-units = 256

# Dev build uses optimized dependencies for efficiency
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
