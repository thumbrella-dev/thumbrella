[workspace.package]
homepage = "https://thumbrella.dev"
repository = "https://github.com/thumbrella-dev/thumbrella"
description = "Fast thumbnail server for online media"
keywords = ["thumbnail", "media"]
categories = ["web-programming::http-server", "multimedia", "graphics", "rendering"]
license = "Apache-2.0"
version = "2.4.3"
edition = "2024"

[package]
name = "thumbrella"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-windows-x86_64.zip"
pkg-fmt = "zip"

# Distinct lib name avoids a doc-output collision with tier3's `thumbrella` bin.
[lib]
name = "thumbrella_doc"

[[bin]]
name = "thumbrella"
path = "tier3/src/bin/tier3.rs"

[dependencies]
tier1 = { path = "tier1" }
tier3 = { path = "tier3" }
tokio = { version = "1", features = ["full"] }

[workspace]
resolver = "2"
default-members = ["tier3"]
members = ["ffs/ffs-check", "ffs/ffs-build", "tier1", "tier2", "tier3"]


[profile.dev]
opt-level = 0      # no optimizations, required for reliable variable inspection
debug = 2          # full debug info (variables, types, not just line tables)
incremental = true
codegen-units = 256

# Dev/test builds: workspace crates stay at opt-level 0 (debuggable, fast
# incremental), but every *dependency* is compiled at 3.  The "*" wildcard
# applies to dependencies only - it never overrides workspace members, so
# tier1/tier2/the root bin remain unoptimized and inspectable.  Dependencies
# are compiled once per dependency change, so this buys usable codec speed
# (image/mozjpeg-rs/jxl at 0 are several times slower) without slowing the
# edit loop.  This is not "more optimized than release": release adds opt-level
# overrides for the app crates, fat LTO, codegen-units = 1, and panic = abort.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# "z" sizes the app crates well but penalises the numeric inner loops in the
# image/codec crates hard: measured on an interlaced 1920x1920 PNG, decoding
# and Lanczos3 downscaling to the canonical 250x200 is ~4.5x slower than at
# opt-level 3 (resize alone ~6x).  Per-package opt-level is honoured even
# under fat LTO (verified), so compile the hot pixel paths for speed and let
# everything else stay size-optimised.
#
# The JPEG encoder and its SIMD helpers matter as much as the decoders, and so
# does the pipeline code in tier1/tier2 that drives them.  Measured on the demo
# media set (exr/jxl/webp/tga, medians of 11 runs): global opt-level 3 cut wall
# time 44% vs "z" only, and adding just these packages to the list below reaches
# the same runtime while building ~1m09s faster from clean (3m37s vs 4m46s).
# Prefer extending this list over switching the whole profile to 3.
[profile.release.package.image]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.jpeg-decoder]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

[profile.release.package.image-extras]
opt-level = 3

[profile.release.package.dds]
opt-level = 3

[profile.release.package.half]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.zune-inflate]
opt-level = 3

[profile.release.package.usvg]
opt-level = 3

[profile.release.package.jxl-oxide]
opt-level = 3

[profile.release.package.jxl-oxide-common]
opt-level = 3

[profile.release.package.jxl-render]
opt-level = 3

[profile.release.package.jxl-modular]
opt-level = 3

[profile.release.package.jxl-vardct]
opt-level = 3

[profile.release.package.jxl-coding]
opt-level = 3

[profile.release.package.jxl-grid]
opt-level = 3

[profile.release.package.jxl-frame]
opt-level = 3

[profile.release.package.jxl-image]
opt-level = 3

[profile.release.package.jxl-color]
opt-level = 3

[profile.release.package.jxl-bitstream]
opt-level = 3

[profile.release.package.jxl-jbr]
opt-level = 3

[profile.release.package.jxl-threadpool]
opt-level = 3

[profile.release.package.tiff]
opt-level = 3

[profile.release.package.gif]
opt-level = 3

[profile.release.package.exr]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

# JPEG encoding (mozjpeg-rs) plus the SIMD crates it leans on.
[profile.release.package.mozjpeg-rs]
opt-level = 3

[profile.release.package.wide]
opt-level = 3

[profile.release.package.archmage]
opt-level = 3

[profile.release.package.safe_unaligned_simd]
opt-level = 3

[profile.release.package.zenyuv]
opt-level = 3

[profile.release.package.rgb]
opt-level = 3

[profile.release.package.imgref]
opt-level = 3

# Pipeline/app crates - the orchestration and colour conversion around the
# codecs is hot too, not just the dependencies.
[profile.release.package.tier1]
opt-level = 3

[profile.release.package.tier2]
opt-level = 3
