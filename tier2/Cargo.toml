[package]
name = "tier2"
version.workspace = true
edition.workspace = true
description = "Static tier 2 Thumbrella server"
publish = false

[dependencies]
tier1 = { path = "../tier1" }
ffs-build = { path = "../ffs/ffs-build" }

# FFmpeg - tier2 codes against these directly; ffs-build handles linking
ffmpeg-next = "9"
ffmpeg-sys-next = "9"

serde_json   = "1"
image        = { version = "0.25", default-features = false, features = ["webp"] }
exr          = { version = "1.74.2", default-features = false }
dds          = { version = "0.2.0", default-features = false }
image-extras = { version = "0.1.1", default-features = false, features = ["icns", "ora", "otb", "pcx", "sgi", "wbmp", "xbm", "xpm"] }
jxl-oxide    = "0.12"
resvg        = "0.48"
# jpeg-decoder: has specialized dct power-of-2 scaler
jpeg-decoder = { version = "0.3", default-features = false }
tokio   = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }

[dev-dependencies]
zip = { version = "5.1.1", default-features = false }
