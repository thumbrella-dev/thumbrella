include = [
   # Generated if user runs any of the static ffmpeg build scripts
   { path = "ffs.toml", optional = true },
]

[target.x86_64-pc-windows-msvc]
# Match Rust CRT with vcpkg's x64-windows-static (/MT).
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
# Use LLD instead of GNU ld. GNU ld's single-pass archive scanning fails to
# pull in img2dec.o from libavformat.a (which registers the webp_pipe demuxer)
# because allformats.o is included first and then references
# ff_image_webp_pipe_demuxer; GNU ld won't re-scan the same archive. LLD
# handles circular archive deps correctly. Both clang and lld are installed in
# the dev container and the Rocky 8 CI image.
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,-u,ff_image_psd_pipe_demuxer",
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--icf=safe",
]

